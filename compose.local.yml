name: flight-booking-baseline
services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    profiles: [messaging]
    ports:
      - "127.0.0.1:31025:1025"
      - "127.0.0.1:38025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.3.6-management
    profiles: [messaging]
    hostname: flight-rabbitmq
    env_file:
      - path: ./.local/rabbitmq.env
        required: false
    ports:
      - "127.0.0.1:35672:5672"
      - "127.0.0.1:35673:15672"
    volumes:
      - baseline-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: [observability]
    ports:
      - "127.0.0.1:39090:9090"
    command: ["--config.file=/etc/prometheus/prometheus.json", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./.local/monitoring/prometheus.json:/etc/prometheus/prometheus.json:ro
      - ./.local/monitoring/secrets:/etc/prometheus/secrets:ro
      - monitoring-prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    ports:
      - "127.0.0.1:33000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flight-booking.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.local/monitoring/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - monitoring-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:36379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: baseline-local-only
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - baseline-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pbaseline-local-only"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  baseline-rabbitmq:
  monitoring-prometheus:
  monitoring-grafana:
  baseline-mysql:
